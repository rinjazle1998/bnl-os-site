<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#07090d"/>
  <!-- Hexagon outline -->
  <polygon
    points="16,2 28,9 28,23 16,30 4,23 4,9"
    fill="rgba(0,212,170,0.15)"
    stroke="#00d4aa"
    stroke-width="1.5"
  />
  <!-- Chip body -->
  <rect x="9" y="9" width="14" height="14" rx="2.5"
    fill="rgba(0,212,170,0.2)"
    stroke="#00d4aa"
    stroke-width="1.5"
  />
  <!-- Pins top -->
  <line x1="13" y1="9"  x2="13" y2="6"  stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="9"  x2="19" y2="6"  stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins bottom -->
  <line x1="13" y1="23" x2="13" y2="26" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="23" x2="19" y2="26" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins left -->
  <line x1="9"  y1="13" x2="6"  y2="13" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9"  y1="19" x2="6"  y2="19" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins right -->
  <line x1="23" y1="13" x2="26" y2="13" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="19" x2="26" y2="19" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="#00d4aa"/>
</svg>
