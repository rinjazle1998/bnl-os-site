<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" aria-hidden="true">
  <!-- Outer hexagon — filled teal, bold -->
  <polygon
    points="20,2 36,11 36,29 20,38 4,29 4,11"
    fill="rgba(0,212,170,0.15)"
    stroke="#00d4aa"
    stroke-width="2"
  />
  <!-- Inner chip body — solid border -->
  <rect x="11" y="11" width="18" height="18" rx="3"
    fill="rgba(0,212,170,0.18)"
    stroke="#00d4aa"
    stroke-width="2"
  />
  <!-- Chip pins top -->
  <line x1="15.5" y1="11" x2="15.5" y2="7"  stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="20"   y1="11" x2="20"   y2="7"  stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="24.5" y1="11" x2="24.5" y2="7"  stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <!-- Chip pins bottom -->
  <line x1="15.5" y1="29" x2="15.5" y2="33" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="20"   y1="29" x2="20"   y2="33" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="24.5" y1="29" x2="24.5" y2="33" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <!-- Chip pins left -->
  <line x1="11" y1="16" x2="7"  y2="16" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="24" x2="7"  y2="24" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <!-- Chip pins right -->
  <line x1="29" y1="16" x2="33" y2="16" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="24" x2="33" y2="24" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <!-- Center core — bright filled circle -->
  <circle cx="20" cy="20" r="3.5" fill="#00d4aa"/>
</svg>
